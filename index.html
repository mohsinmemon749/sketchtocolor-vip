function useLocalStorage(key, initialValue) {
    const [storedValue, setStoredValue] = useState(() => {
        try {
            const item = window.localStorage.getItem(key);
            return item ? JSON.parse(item) : initialValue;
        } catch (error) { return initialValue; }
    });
    const setValue = (value) => {
        try {
            const valueToStore = value instanceof Function ? value(storedValue) : value;
            setStoredValue(valueToStore);
            window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) { console.error(error); }
    };
    return [storedValue, setValue];
}

    // IMPROVED HIGH-SIMILARITY PHOTO TO SKETCH ENGINE + VECTOR TEMPLATE SUPPORT
    const convertImageToLineArt = (src, thresh, thickness, denoise, isVectorTemplate = false) => {
        return new Promise((resolve) => {
            if (isVectorTemplate && src.startsWith('data:image/svg+xml')) {
                const decoded = decodeURIComponent(src.replace('data:image/svg+xml;utf8,', ''));
                let baseW = thickness === 1 ? 3.5 : thickness === 2 ? 6 : 9.5;
                let strokeW = Math.max(1, baseW + ((thresh - 90) / 12));
                const updatedSvg = decoded.replace(/stroke-width="[^"]*"/, `stroke-width="${strokeW}"`);
                resolve('data:image/svg+xml;utf8,' + encodeURIComponent(updatedSvg));
                return;
            }

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxDim = 900;
                let w = img.width, h = img.height;
                if (w > h) { if (w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; } } 
                else { if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; } }
                canvas.width = w; canvas.height = h;

                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, w, h);
                ctx.filter = denoise === 2 ? 'blur(1.6px)' : denoise === 1 ? 'blur(0.7px)' : 'none';
                ctx.drawImage(img, 0, 0, w, h);
                ctx.filter = 'none';

                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                const gray = new Float32Array(w * h);
                let minL = 255, maxL = 0;
                for (let i = 0; i < data.length; i += 4) {
                    const lum = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                    gray[i / 4] = lum;
                    if (lum < minL) minL = lum;
                    if (lum > maxL) maxL = lum;
                }

                // Auto-contrast stretch for maximum facial & detail similarity
                const range = Math.max(1, maxL - minL);
                for (let i = 0; i < gray.length; i++) {
                    gray[i] = ((gray[i] - minL) / range) * 255;
                }

                // Local neighborhood mean for adaptive facial feature definition (eyes, smile, hair)
                const integral = new Float64Array((w + 1) * (h + 1));
                for (let y = 1; y <= h; y++) {
                    let rowSum = 0;
                    for (let x = 1; x <= w; x++) {
                        rowSum += gray[(y - 1) * w + (x - 1)];
                        integral[y * (w + 1) + x] = integral[(y - 1) * (w + 1) + x] + rowSum;
                    }
                }

                const rawEdges = new Uint8Array(w * h);
                const gxK = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
                const gyK = [-1, -2, -1, 0, 0, 0, 1, 2, 1];

                // Map UI slider (35..175, default 90) so higher = more sensitive or clean default at 90
                const effectiveThresh = Math.max(22, thresh * 0.78);
                const winR = 7;

                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        let sumX = 0, sumY = 0, k = 0;
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                const val = gray[(y + ky) * w + (x + kx)];
                                sumX += val * gxK[k];
                                sumY += val * gyK[k];
                                k++;
                            }
                        }
                        const mag = Math.sqrt(sumX * sumX + sumY * sumY);

                        const x1 = Math.max(0, x - winR), y1 = Math.max(0, y - winR);
                        const x2 = Math.min(w - 1, x + winR), y2 = Math.min(h - 1, y + winR);
                        const count = (x2 - x1 + 1) * (y2 - y1 + 1);
                        const localSum = integral[(y2 + 1) * (w + 1) + (x2 + 1)]
                                       - integral[y1 * (w + 1) + (x2 + 1)]
                                       - integral[(y2 + 1) * (w + 1) + x1]
                                       + integral[y1 * (w + 1) + x1];
                        const localMean = localSum / count;
                        const pixelVal = gray[y * w + x];

                        const isSobelEdge = mag > effectiveThresh;
                        const isAdaptiveDarkDetail = (localMean - pixelVal) > (effectiveThresh * 0.28) && pixelVal < 165;

                        rawEdges[y * w + x] = (isSobelEdge || isAdaptiveDarkDetail) ? 1 : 0;
                    }
                }

                const dilated = new Uint8Array(w * h);
                const radius = thickness - 1;
                if (radius <= 0) {
                    dilated.set(rawEdges);
                } else {
                    for (let y = radius; y < h - radius; y++) {
                        for (let x = radius; x < w - radius; x++) {
                            let hit = 0;
                            for (let dy = -radius; dy <= radius && !hit; dy++) {
                                for (let dx = -radius; dx <= radius; dx++) {
                                    if (rawEdges[(y + dy) * w + (x + dx)] === 1) { hit = 1; break; }
                                }
                            }
                            dilated[y * w + x] = hit;
                        }
                    }
                }

                const outData = ctx.createImageData(w, h);
                for (let i = 0; i < dilated.length; i++) {
                    const isEdge = dilated[i] === 1;
                    const c = isEdge ? 0 : 255;
                    const idx = i * 4;
                    outData.data[idx] = c;
                    outData.data[idx + 1] = c;
                    outData.data[idx + 2] = c;
                    outData.data[idx + 3] = 255;
                }
                ctx.putImageData(outData, 0, 0);
                resolve(canvas.toDataURL('image/png'));
            };
            img.src = src;
        });
    };

    const handleBulkFilesAndPDFUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;

        const defaultThresh = 90;
        const defaultThick = 2;
        const defaultDenoise = 1;

        const newPages = [];
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.type === 'application/pdf' && window.pdfjsLib) {
                const arrayBuf = await file.arrayBuffer();
                const pdf = await window.pdfjsLib.getDocument({ data: arrayBuf }).promise;
                for (let pNum = 1; pNum <= pdf.numPages; pNum++) {
                    const pdfPage = await pdf.getPage(pNum);
                    const viewport = pdfPage.getViewport({ scale: 1.5 });
                    const c = document.createElement('canvas');
                    c.width = viewport.width;
                    c.height = viewport.height;
                    await pdfPage.render({ canvasContext: c.getContext('2d'), viewport }).promise;
                    const pageDataUrl = c.toDataURL('image/png');
                    newPages.push({
                        id: 'page_' + Date.now() + '_' + pNum + '_' + Math.random(),
                        name: `PDF Page ${pNum}`,
                        title: `${bannerText}`,
                        caption: subBannerText,
                        originalUrl: pageDataUrl,
                        sketchUrl: pageDataUrl,
                        rawPaintUrl: null,
                        compositeUrl: null,
                        isVectorTemplate: false,
                        threshold: defaultThresh,
                        lineThickness: defaultThick,
                        denoiseLevel: defaultDenoise,
                        attemptHistory: []
                    });
                }
            } else if (file.type.startsWith('image/')) {
                const dataUrl = await new Promise((res) => {
                    const r = new FileReader();
                    r.onload = ev => res(ev.target.result);
                    r.readAsDataURL(file);
                });
                const sketchUrl = await convertImageToLineArt(dataUrl, defaultThresh, defaultThick, defaultDenoise, false);
                newPages.push({
                    id: 'page_' + Date.now() + '_' + i + '_' + Math.random(),
                    name: `📷 ${file.name.replace(/\.[^/.]+$/, "").slice(0, 14)}`,
                    title: `${bannerText}`,
                    caption: subBannerText,
                    originalUrl: dataUrl,
                    sketchUrl,
                    rawPaintUrl: null,
                    compositeUrl: null,
                    isVectorTemplate: false,
                    threshold: defaultThresh,
                    lineThickness: defaultThick,
                    denoiseLevel: defaultDenoise,
                    attemptHistory: []
                });
            }
        }

        if (newPages.length > 0) {
            setThreshold(defaultThresh);
            setLineThickness(defaultThick);
            setDenoiseLevel(defaultDenoise);
            setPages(prev => {
                const combined = [...prev, ...newPages];
                setActivePageIdx(prev.length);
                return combined;
            });

        e.target.value = '';
    };

    const currentPage = pages[activePageIdx] || pages[0];

    const applyFilterToActivePage = async (newThresh, newThick, newDenoise) => {
        if (!currentPage || !currentPage.originalUrl) return;

    // Reorder & Duplicate Templates / Pages
    const movePageOrder = (idx, dir) => {

        if (targetIdx < 0 || targetIdx >= pages.length) return;
        setPages(prev => {
            const copy = [...prev];

            copy[idx] = copy[targetIdx];

    // DIGITAL COLORING & LIVE BRUSH CURSOR PREVIEW
    const paintLayerRef = useRef(null);
    const overlayLayerRef = useRef(null);
    const sketchImgRef = useRef(null);
    const [brushColor, setBrushColor] = useState("#f43f5e");
    const [brushSize, setBrushSize] = useState(18);

    const buildCompositeDataUrl = () => {
        const paintCanvas = paintLayerRef.current;
        const topCanvas = overlayLayerRef.current;
        if (!paintCanvas || !topCanvas) return null;
        const merged = document.createElement('canvas');
        merged.width = topCanvas.width;
        merged.height = topCanvas.height;
        const mCtx = merged.getContext('2d');
        mCtx.fillStyle = "#ffffff";
        mCtx.fillRect(0, 0, merged.width, merged.height);
        mCtx.drawImage(paintCanvas, 0, 0);
        mCtx.globalCompositeOperation = 'multiply';
        mCtx.drawImage(topCanvas, 0, 0);
        mCtx.globalCompositeOperation = 'source-over';
        return merged.toDataURL('image/png');
    };

    const savePaintAndCompositeToPage = () => {
        const paintCanvas = paintLayerRef.current;
        if (!paintCanvas) return;
        const rawPaint = paintCanvas.toDataURL('image/png');
        const mergedComposite = buildCompositeDataUrl();
        setPages(prev => prev.map((p, idx) => idx === activePageIdx ? { ...p, rawPaintUrl: rawPaint, compositeUrl: mergedComposite } : p));
    };

    const computeCanvasMetrics = (paintCanvas) => {
        const pData = paintCanvas.getContext('2d').getImageData(0, 0, paintCanvas.width, paintCanvas.height).data;
        const W = paintCanvas.width;
        const H = paintCanvas.height;
        let paintedPixelsInsideZone = 0;
        let paintedPixelsOutsideMargins = 0;
        const colorBuckets = new Set();

        for (let y = 0; y < H; y += 2) {
            for (let x = 0; x < W; x += 2) {
                const idx = (y * W + x) * 4;
                if (pData[idx + 3] > 25) {
                    const r = pData[idx], g = pData[idx + 1], b = pData[idx + 2];
                    colorBuckets.add(`${Math.floor(r/50)}-${Math.floor(g/50)}-${Math.floor(b/50)}`);
                    const inMargin = (x < 42 || x > W - 42 || y < 120 || y > H - 110);
                    if (inMargin) paintedPixelsOutsideMargins++; else paintedPixelsInsideZone++;
                }
            }
        }

        const totalSampledZone = ((W - 84) * (H - 230)) / 4;
        const rawCoveragePct = (paintedPixelsInsideZone / totalSampledZone) * 100;
        if (paintedPixelsInsideZone < 80) {
            return { empty: true, score: 10, coverage: 2, variety: 5, neatness: 95 };
        }
        const coverageScore = Math.min(100, Math.round(Math.pow(rawCoveragePct / 35, 0.72) * 100));
        const varietyScore = Math.min(100, Math.max(45, colorBuckets.size * 11));
        const bleedRatio = paintedPixelsOutsideMargins / (paintedPixelsInsideZone + paintedPixelsOutsideMargins + 1);
        const neatnessScore = Math.max(40, Math.min(99, Math.round(100 - (bleedRatio * 180))));
        const finalScore = Math.round((coverageScore * 0.40) + (neatnessScore * 0.40) + (varietyScore * 0.20));
        return { empty: false, score: finalScore, coverage: coverageScore, variety: varietyScore, neatness: neatnessScore };
    };

    // Save current painting to attempt history & optionally clear canvas for a fresh attempt
    const savePaintingAttemptAndStartFresh = (clearForNext = true) => {
        const paintCanvas = paintLayerRef.current;
        if (!paintCanvas) return;
        const rawPaint = paintCanvas.toDataURL('image/png');
        const mergedComposite = buildCompositeDataUrl();
        const metrics = computeCanvasMetrics(paintCanvas);

        const prevAttempts = currentPage?.attemptHistory || [];
        const lastAttempt = prevAttempts.length > 0 ? prevAttempts[prevAttempts.length - 1] : null;
        const improvement = lastAttempt ? (metrics.score - lastAttempt.score) : 0;

        const newAttempt = {
            id: 'att_' + Date.now(),
            attemptNumber: prevAttempts.length + 1,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            rawPaintUrl: rawPaint,
            compositeUrl: mergedComposite,
            score: metrics.score,
            coverage: metrics.coverage,
            variety: metrics.variety,
            neatness: metrics.neatness,
            improvement
        };

        setPages(prev => prev.map((p, idx) => {
            if (idx !== activePageIdx) return p;
            const updatedHistory = [...(p.attemptHistory || []), newAttempt];
            return {
                ...p,
                attemptHistory: updatedHistory,
                rawPaintUrl: clearForNext ? null : rawPaint,
                compositeUrl: clearForNext ? null : mergedComposite
            };
        }));

        if (clearForNext) {
            const ctx = paintCanvas.getContext('2d');
            ctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
        }
    };

    const loadAttemptOntoCanvas = (attempt) => {
        const paintCanvas = paintLayerRef.current;
        if (!paintCanvas || !attempt?.rawPaintUrl) return;
        pushUndoState();
        const ctx = paintCanvas.getContext('2d');
        const img = new Image();
        img.onload = () => {

    const pushUndoState = () => {

    const handleUndoStroke = () => {

    // Helper to draw clean hollow/3D/trace/solid text on Canvas matching CSS styles
    const drawStyledCanvasText = (tCtx, textStr, x, y, maxFontSize, maxWidth, styleMode) => {
        tCtx.save();
        tCtx.textAlign = "center";
        tCtx.textBaseline = "middle";
        tCtx.lineJoin = "round";
        tCtx.lineCap = "round";
        tCtx.miterLimit = 2;
        if (tCtx.letterSpacing !== undefined) {
            tCtx.letterSpacing = styleMode === 'trace' ? "3.5px" : "0px";
        }

        const fontFamily = styleMode === 'trace' ? "'Plus Jakarta Sans', sans-serif" : "'Fredoka', sans-serif";
        const fontWeight = styleMode === 'trace' ? "800" : "900";
        let fontSize = maxFontSize;
        tCtx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
        while (tCtx.measureText(textStr).width > maxWidth && fontSize > 12) {
            fontSize -= 1;
            tCtx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
        }

        if (styleMode === 'bubble') {
            tCtx.lineWidth = 6.5;
            tCtx.strokeStyle = "#000000";
            tCtx.fillStyle = "#ffffff";
            tCtx.strokeText(textStr, x, y);
            tCtx.fillText(textStr, x, y);
        } else if (styleMode === '3d') {
            tCtx.lineWidth = 5.5;
            // Solid 3D pop shadow offset (4px, 4px)
            tCtx.strokeStyle = "#000000";
            tCtx.fillStyle = "#000000";
            tCtx.strokeText(textStr, x + 4, y + 4);
            tCtx.fillText(textStr, x + 4, y + 4);
            // Clean hollow white face on top
            tCtx.strokeStyle = "#000000";
            tCtx.fillStyle = "#ffffff";
            tCtx.strokeText(textStr, x, y);
            tCtx.fillText(textStr, x, y);
        } else if (styleMode === 'trace') {
            tCtx.lineWidth = 3.6;
            tCtx.strokeStyle = "#64748b";
            tCtx.fillStyle = "#ffffff";
            tCtx.strokeText(textStr, x, y);
            tCtx.fillText(textStr, x, y);
        } else {
            tCtx.fillStyle = "#000000";
            tCtx.fillText(textStr, x, y);
        }
        tCtx.restore();

                setTimeout(() => {

                    const imgEl = sketchImgRef.current;
                    const canvasRect = topCanvas.getBoundingClientRect();
                    const imgRect = imgEl.getBoundingClientRect();

                    const scaleX = topCanvas.width / canvasRect.width;
                    const scaleY = topCanvas.height / canvasRect.height;

                    const dx = (imgRect.left - canvasRect.left) * scaleX;
                    const dy = (imgRect.top - canvasRect.top) * scaleY;

    const executeFloodFill = (startX, startY, fillHex) => {
        const paintCanvas = paintLayerRef.current;
        const topCanvas = overlayLayerRef.current;
        if (!paintCanvas || !topCanvas) return;

        const W = paintCanvas.width;
        const H = paintCanvas.height;
        const pCtx = paintCanvas.getContext('2d');
        const tCtx = topCanvas.getContext('2d');

        const pImgData = pCtx.getImageData(0, 0, W, H);
        const pData = pImgData.data;
        const tData = tCtx.getImageData(0, 0, W, H).data;

        const sx = Math.floor(startX);
        const sy = Math.floor(startY);
        if (sx < 0 || sx >= W || sy < 0 || sy >= H) return;

        const rFill = parseInt(fillHex.slice(1, 3), 16);
        const gFill = parseInt(fillHex.slice(3, 5), 16);
        const bFill = parseInt(fillHex.slice(5, 7), 16);

        const startIdx = (sy * W + sx) * 4;
        if (tData[startIdx] < 90 && tData[startIdx + 1] < 90 && tData[startIdx + 2] < 90) return;

        const targetR = pData[startIdx];
        const targetG = pData[startIdx + 1];
        const targetB = pData[startIdx + 2];
        const targetA = pData[startIdx + 3];

        if (targetR === rFill && targetG === gFill && targetB === bFill && targetA === 255) return;

        const visited = new Uint8Array(W * H);
        const queue = [sx, sy];
        let maxPixels = 160000;

        while (queue.length > 0 && maxPixels-- > 0) {
            const cy = queue.pop();
            const cx = queue.pop();
            const pos = cy * W + cx;
            if (visited[pos]) continue;
            visited[pos] = 1;

            const idx = pos * 4;
            if (tData[idx] < 110 && tData[idx + 1] < 110 && tData[idx + 2] < 110) continue;
            const diff = Math.abs(pData[idx] - targetR) + Math.abs(pData[idx + 1] - targetG) + Math.abs(pData[idx + 2] - targetB) + Math.abs(pData[idx + 3] - targetA);
            if (diff > 65) continue;

            pData[idx] = rFill;
            pData[idx + 1] = gFill;
            pData[idx + 2] = bFill;
            pData[idx + 3] = 255;

            if (cx > 22) queue.push(cx - 1, cy);
            if (cx < W - 22) queue.push(cx + 1, cy);
            if (cy > 22) queue.push(cx, cy - 1);
            if (cy < H - 22) queue.push(cx, cy + 1);
        }
        pCtx.putImageData(pImgData, 0, 0);
        savePaintAndCompositeToPage();
    };

    const getCanvasCoords = (e) => {
        const canvas = paintLayerRef.current;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height),
            cssX: clientX - rect.left,
            cssY: clientY - rect.top,
            scaleRatio: rect.width / canvas.width
        };
    };

    const startDigitalStroke = (e) => {

    const moveDigitalStroke = (e) => {

        const { x, y, cssX, cssY, scaleRatio } = getCanvasCoords(e);

        if (!isDrawing || brushMode === 'bucket') return;
        e.preventDefault();
        const ctx = canvas.getContext('2d');

        if (brushMode === 'eraser') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineTo(x, y);
            ctx.lineWidth = brushSize * 1.4;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';
            return;
        }

        ctx.globalCompositeOperation = 'source-over';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (brushMode === 'solid') {
            ctx.strokeStyle = brushColor; ctx.lineWidth = brushSize; ctx.lineTo(x, y); ctx.stroke();
        } else if (brushMode === 'rainbow') {
            hueRef.current = (hueRef.current + 5) % 360;
            ctx.strokeStyle = `hsl(${hueRef.current}, 90%, 55%)`; ctx.lineWidth = brushSize; ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
        } else if (brushMode === 'dots') {
            ctx.fillStyle = brushColor;
            if (Math.random() > 0.35) { ctx.beginPath(); ctx.arc(x + (Math.random() - 0.5) * brushSize, y + (Math.random() - 0.5) * brushSize, brushSize / 3, 0, Math.PI * 2); ctx.fill(); }
        } else if (brushMode === 'stars') {
            if (Math.random() > 0.45) { ctx.font = `${Math.max(12, brushSize)}px sans-serif`; ctx.fillStyle = brushColor; ctx.fillText("★", x + (Math.random() - 0.5) * brushSize, y + (Math.random() - 0.5) * brushSize); }
        } else if (brushMode === 'stripes') {
            ctx.fillStyle = brushColor; ctx.fillRect(x - brushSize / 2, y - 2, brushSize, 4);
        } else if (brushMode === 'neon') {
            ctx.shadowColor = brushColor; ctx.shadowBlur = 12; ctx.strokeStyle = brushColor; ctx.lineWidth = brushSize * 0.7; ctx.lineTo(x, y); ctx.stroke(); ctx.shadowBlur = 0;

    };

        const prevAttempts = currentPage?.attemptHistory || [];
        const lastAttempt = prevAttempts.length > 0 ? prevAttempts[prevAttempts.length - 1] : null;
        const improvement = lastAttempt ? (metrics.score - lastAttempt.score) : 0;

        };

        const finalScore = metrics.score;
        let badge = finalScore >= 88 ? "👑 Grand Master Colorist" : finalScore >= 72 ? "🎨 Creative Pro Painter" : "🌟 Rising Young Artist";
        let comment = finalScore >= 88 ? "Incredible precision! You stayed neatly inside the drawing zone and used a rich, vibrant color palette!" : "Great job! Lovely color combinations and very neat brushwork!";
        
        setScoreResult({ rejected: false, score: finalScore, coverage: metrics.coverage, variety: metrics.variety, neatness: metrics.neatness, improvement, prevScore: lastAttempt?.score ?? null, attemptNumber: newAttempt.attemptNumber, badge, comment });
        setActiveTab('scorer');
    };

    const evaluateScannedSheet = (scanUrl) => {
        const img = new Image();
        img.onload = () => {
            const S = 200;
            const c = document.createElement('canvas');
            const ctx = c.getContext('2d');
            c.width = S; c.height = S;
            ctx.drawImage(img, 0, 0, S, S);
            const data = ctx.getImageData(0, 0, S, S).data;

            let whitePaperCount = 0, borderWhiteCount = 0, borderTotalCount = 0, coloredCrayonCount = 0, sharpEdgeTransitions = 0;
            const colorBuckets = new Set();

            for (let y = 1; y < S - 1; y++) {
                for (let x = 1; x < S - 1; x++) {
                    const idx = (y * S + x) * 4;
                    const r = data[idx], g = data[idx + 1], b = data[idx + 2];
                    const max = Math.max(r, g, b), min = Math.min(r, g, b);
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    const sat = max - min;
                    const isBorder = (x < S * 0.12 || x > S * 0.88 || y < S * 0.12 || y > S * 0.88);
                    
                    if (isBorder) {
                        borderTotalCount++;
                        if (lum > 175 && sat < 42) borderWhiteCount++;
                    }
                    if (lum > 185 && sat < 38) {
                        whitePaperCount++;
                    } else if (sat >= 28 && lum > 40 && lum < 235) {
                        coloredCrayonCount++;
                        colorBuckets.add(`${Math.floor(r/50)}-${Math.floor(g/50)}-${Math.floor(b/50)}`);
                    }
                    const rightIdx = (y * S + (x + 1)) * 4;
                    const rightLum = 0.299 * data[rightIdx] + 0.587 * data[rightIdx+1] + 0.114 * data[rightIdx+2];
                    if (Math.abs(lum - rightLum) > 75) sharpEdgeTransitions++;
                }
            }

            const total = S * S;
            const paperPct = (whitePaperCount / total) * 100;
            const borderWhitePct = (borderWhiteCount / (borderTotalCount || 1)) * 100;
            const edgePct = (sharpEdgeTransitions / total) * 100;
            const colorPct = (coloredCrayonCount / total) * 100;

            if (paperPct < 22 || borderWhitePct < 25 || edgePct < 1.8) {
                setScoreResult({ rejected: true, reason: `Verification Failed! 🛑 This looks like a real-life photo or dark camera shot—not a white coloring book sheet!` });
                return;
            }
            if (colorPct < 1.2) {
                setScoreResult({ rejected: false, score: 14, coverage: 4, variety: 8, neatness: 90, badge: "📄 Uncolored Sketch Detected", comment: "We detected a valid black-and-white sheet, but it hasn't been colored yet!" });
                return;
            }

            const coverageScore = Math.min(99, Math.max(48, Math.round(Math.pow(colorPct / 32, 0.7) * 100)));
            const varietyScore = Math.min(99, Math.max(55, colorBuckets.size * 9));
            const neatnessScore = Math.min(99, Math.max(65, Math.round((borderWhitePct * 0.6) + (coverageScore * 0.4))));
            const finalScore = Math.round((coverageScore * 0.4) + (neatnessScore * 0.35) + (varietyScore * 0.25));

            let badge = finalScore >= 88 ? "👑 Grand Master Colorist" : finalScore >= 75 ? "🎨 Super Pro Painter" : "🌟 Creative Artist";
            setScoreResult({ rejected: false, score: finalScore, coverage: coverageScore, variety: varietyScore, neatness: neatnessScore, badge, comment: "Verified coloring sheet! Beautiful effort!" });
        };

                            </div>
                            {scoringImage && <div className="border rounded-xl overflow-hidden h-56 bg-black/5 flex items-center justify-center p-2"><img src={scoringImage} alt="Scanned Sheet" className="h-full object-contain rounded" /></div>}

                            {currentPage?.attemptHistory?.length > 0 && (
                                <div className="p-3.5 rounded-xl theme-card border space-y-2">
                                    <span className="text-[10px] font-extrabold uppercase tracking-wider block" style={{color: 'var(--accent)'}}>📊 Improvement History for "{currentPage.title}"</span>
                                    <div className="space-y-1.5 max-h-40 overflow-y-auto">
                                        {currentPage.attemptHistory.map((att) => (
                                            <div key={att.id} onClick={() => { setScoringImage(att.compositeUrl); setScoreResult({ rejected: false, score: att.score, coverage: att.coverage, variety: att.variety, neatness: att.neatness, improvement: att.improvement, attemptNumber: att.attemptNumber, badge: att.score >= 88 ? "👑 Grand Master Colorist" : "🎨 Creative Pro Painter", comment: "Loaded from your saved attempt history!" }); }} className="flex items-center justify-between p-2 rounded-lg theme-panel border text-xs cursor-pointer hover:opacity-85">
                                                <div className="flex items-center gap-2">
                                                    <img src={att.compositeUrl} alt="" className="w-8 h-10 object-contain bg-white rounded border" />
                                                    <div>
                                                        <div className="font-black">Attempt #{att.attemptNumber}</div>
                                                        <div className="text-[10px] opacity-60">{att.timestamp}</div>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-black text-sm" style={{color: 'var(--accent)'}}>{att.score}%</div>
                                                    {att.improvement !== 0 && (
                                                        <div className={`text-[10px] font-bold ${att.improvement > 0 ? 'text-emerald-600' : 'text-rose-500'}`}>
                                                            {att.improvement > 0 ? `+${att.improvement}% Improved` : `${att.improvement}%`}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className="theme-panel border rounded-2xl p-6 flex flex-col justify-center print-page">
                            {scoreResult ? (
                                scoreResult.rejected ? (
                                    <div className="p-6 rounded-2xl bg-rose-500/10 border-2 border-rose-500 text-center space-y-3"><div className="text-4xl">🚫</div><h4 className="text-base font-black text-rose-500 uppercase">Not a Valid Coloring Sheet!</h4><p className="text-xs font-semibold leading-relaxed">{scoreResult.reason}</p></div>
                                ) : (
                                    <div className="border-4 border-double border-amber-500 bg-white text-black p-6 rounded-2xl space-y-4 text-center shadow-md">
                                        <div className="text-2xl">🏆 ⭐ 🎨 ⭐ 🏆</div>
                                        <h3 className="text-xl font-black uppercase serif-font tracking-wide">OFFICIAL COLORING AWARD CERTIFICATE</h3>
                                        <p className="text-xs font-bold uppercase text-slate-500">Proudly Presented To</p>
                                        <div className="text-2xl font-black kids-font underline decoration-rose-500">{artistNameForCert}</div>
                                        <div className="py-2">
                                            <span className="px-3 py-1 rounded-full text-xs font-black bg-amber-100 text-amber-900 border border-amber-400">{scoreResult.badge}</span>
                                            <div className="text-6xl font-black kids-font text-rose-600 mt-2">{scoreResult.score}%</div>
                                            {scoreResult.improvement !== undefined && scoreResult.improvement !== 0 && (
                                                <div className={`inline-block mt-1 px-3 py-0.5 rounded-full text-xs font-black ${scoreResult.improvement > 0 ? 'bg-emerald-100 text-emerald-800 border border-emerald-400' : 'bg-rose-100 text-rose-800 border border-rose-300'}`}>
                                                    {scoreResult.improvement > 0 ? `📈 +${scoreResult.improvement}% Improvement Since Last Attempt!` : `📊 ${scoreResult.improvement}% vs Previous Attempt`}
                                                </div>
                                            )}
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 text-xs font-bold">
                                            <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-200"><span className="block text-[10px] text-slate-500">Zone Coverage</span><span className="text-base font-black">{scoreResult.coverage}%</span></div>
                                            <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-200"><span className="block text-[10px] text-slate-500">Color Variety</span><span className="text-base font-black">{scoreResult.variety}%</span></div>
                                            <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-200"><span className="block text-[10px] text-slate-500">Line Precision</span><span className="text-base font-black">{scoreResult.neatness}%</span></div>
                                        </div>
                                        <p className="text-xs font-bold p-3 rounded-xl bg-amber-50/70 border border-amber-200">💬 "{scoreResult.comment}"</p>
                                        <div className="pt-2 no-print"><button onClick={() => window.print()} className="theme-accent-bg px-6 py-2.5 rounded-xl text-xs font-black uppercase cursor-pointer shadow">🎓 Print Award Certificate</button></div>
                                    </div>
                                )
                            ) : <div className="py-20 text-center text-xs font-bold opacity-50">Scan a colored sheet or click "AI Score My Art" to generate an Award Certificate!</div>}
                        </div>
                    </div>
                )}

                {activeTab === 'settings' && (
                    <div className="max-w-3xl mx-auto theme-panel border rounded-2xl p-6 md:p-8 space-y-6 shadow-xs">
                        <div><h3 className="text-lg font-black kids-font">⚙️ Settings & Data Vault</h3><p className="text-xs" style={{color: 'var(--text-muted)'}}>Manage your coloring studio experience.</p></div>
                        
                        <div className="space-y-3 pt-4 border-t" style={{borderColor: 'var(--border)'}}>
                            <label className="text-xs font-extrabold uppercase tracking-wider block" style={{color: 'var(--accent)'}}>1. Studio Color Theme</label>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                {[{ id: 'light', label: '🌸 Pastel Rose (Default)' }, { id: 'mint', label: '🌿 Mint Studio' }, { id: 'dark', label: '🌙 Midnight Dark' }].map(t => (
                                    <button key={t.id} onClick={() => setTheme(t.id)} className={`py-3 px-4 rounded-xl text-xs font-bold border cursor-pointer ${theme === t.id ? 'theme-accent-bg' : 'theme-card'}`}>{t.label}</button>
                                ))}
                            </div>
                        </div>

                        <div className="space-y-3 pt-4 border-t" style={{borderColor: 'var(--border)'}}>
                            <label className="text-xs font-extrabold uppercase tracking-wider block" style={{color: 'var(--accent)'}}>2. Built-in MP3 Audio Player</label>
                            <div className="theme-card p-4 rounded-xl border flex flex-col md:flex-row items-center justify-between gap-4">
                                <div className="text-xs">
                                    <p className="font-bold">Play Music While Coloring</p>
                                    <p className="opacity-75">Upload MP3 files to play in the background.</p>
                                </div>
                                <div className="flex gap-2 w-full md:w-auto">
                                    {soundStatus !== 'off' && (
                                        <div className="flex gap-1 bg-slate-100 dark:bg-slate-800 rounded-lg p-1 border">
                                            <button onClick={() => skipTrack(-1)} className="px-2 font-bold cursor-pointer hover:text-rose-500">⏮</button>
                                            <button onClick={togglePlayTrack} className="px-2 font-bold cursor-pointer hover:text-rose-500">{soundStatus === 'mp3_playing' ? '⏸' : '▶'}</button>
                                            <button onClick={() => skipTrack(1)} className="px-2 font-bold cursor-pointer hover:text-rose-500">⏭</button>
                                        </div>
                                    )}
                                    <label className="theme-accent-bg py-2 px-4 rounded-lg text-xs font-bold cursor-pointer shadow text-center whitespace-nowrap">
                                        📂 Upload MP3s
                                        <input type="file" accept="audio/*" multiple onChange={handlePlaylistUpload} className="hidden" />
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div className="space-y-3 pt-4 border-t" style={{borderColor: 'var(--border)'}}>
                            <label className="text-xs font-extrabold uppercase tracking-wider block" style={{color: 'var(--accent)'}}>3. Data Vault (Backup & Restore)</label>
                            <div className="theme-card p-4 rounded-xl border">
                                <p className="text-xs opacity-75 mb-4">Export a JSON file to save your templates, colors, and layers. Use it to restore your work if you clear your browser history.</p>
                                <div className="flex flex-wrap gap-3">
                                    <button onClick={exportBackupJSON} className="flex-1 py-2 rounded-lg border bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-500/30 text-xs font-bold cursor-pointer hover:bg-blue-500/20">
                                        💾 Export JSON Backup
                                    </button>
                                    <label className="flex-1 py-2 rounded-lg border theme-panel text-xs font-bold cursor-pointer hover:opacity-80 text-center">
                                        📂 Import Backup
                                        <input type="file" accept=".json" onChange={importBackupJSON} className="hidden" />
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div className="pt-4 flex justify-end">
                            <button onClick={() => setActiveTab('studio')} className="theme-accent-bg px-6 py-2.5 rounded-xl text-xs font-black uppercase cursor-pointer shadow">✅ Return to Studio</button>
                        </div>
                    </div>
                )}

            </main>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
